[workspace]
resolver = "3"
members = ["crates/sim", "crates/server", "crates/client"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# wasm (OWNER C4, see build-web.*): size-optimised. The old opt-level 3 build was 49.5 MB (43 MB of code, no debug
# info): "s" + fat LTO + one codegen unit, then wasm-opt. Built with:
#   cargo build -p ts-client --lib --profile wasm-release --target wasm32-unknown-unknown
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = false
# debuginfo only: keeps the custom sections wasm-bindgen reads
strip = "debuginfo"
panic = "abort"

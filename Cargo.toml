[workspace]
resolver = "3"
members = ["crates/sim", "crates/server", "crates/client"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# wasm: smaller + fast. Built with: cargo build --profile wasm-release --target wasm32-unknown-unknown -p ts-client
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "fat"

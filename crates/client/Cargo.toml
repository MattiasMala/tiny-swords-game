[package]
name = "ts-client"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# bin name differs from the lib (`ts_client`) to avoid the Windows .pdb output collision
[[bin]]
name = "tiny-swords"
path = "src/main.rs"

[dependencies]
ts-sim = { path = "../sim" }
serde.workspace = true
postcard.workspace = true
serde_json = "1"
# synchronous text measurement for the immediate-mode UI (C3): same version/features as bevy_text uses
parley = { version = "0.11.1", default-features = false, features = ["std"] }
# Feature list = docs/bevy-0.20-notes.md §1.3 option A (webgl2 only, no webgpu), with the collections
# (`default_app`, `3d_bevy_render`, `ui_api`, `ui_bevy_render`) expanded by hand to leave out what the HD-2D client
# never uses but costs wasm size (C4, build size): glTF + scenes, animation / morph targets, mikktspace,
# SMAA LUTs, `.hdr` images, reflection auto-registration, mesh / UI picking backends, UI widgets.
# The world is PNG sprites on block terrain; re-add `bevy_gltf` (+ `gltf_animation`) if 3D models are ever loaded.
bevy = { version = "0.20.1", default-features = false, features = [
  # app / platform
  "std", "async_executor", "bevy_asset", "bevy_log", "bevy_state", "bevy_winit", "webgl2", "multi_threaded",
  "custom_cursor", "default_font",
  # common api
  "bevy_camera", "bevy_color", "bevy_curve", "bevy_gizmos", "bevy_image", "bevy_mesh", "bevy_shader",
  "bevy_material", "bevy_text", "bevy_window", "png", "bevy_light",
  # the tonemapping LUTs are ktx2 + zstd textures
  "tonemapping_luts", "ktx2", "zstd_rust",
  # renderer
  "bevy_render", "bevy_core_pipeline", "bevy_gizmos_render", "bevy_anti_alias", "bevy_pbr", "bevy_post_process",
  # ui
  "bevy_input_focus", "bevy_ui", "bevy_ui_render",
  # audio, picking (`Pickable` only; no backend is used)
  "bevy_audio", "wav", "bevy_picking",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "BinaryType", "Window", "Location", "Storage", "CloseEvent", "ErrorEvent", "Event", "BeforeUnloadEvent"] }
js-sys = "0.3"

[package]
name = "ts-client"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# bin name differs from the lib (`ts_client`) to avoid the Windows .pdb output collision
[[bin]]
name = "tiny-swords"
path = "src/main.rs"

[dependencies]
ts-sim = { path = "../sim" }
serde.workspace = true
postcard.workspace = true
serde_json = "1"
# synchronous text measurement for the immediate-mode UI (C3): same version/features as bevy_text uses
parley = { version = "0.11.1", default-features = false, features = ["std"] }
# Feature list = docs/bevy-0.20-notes.md §1.3 option A (webgl2 only, no webgpu).
bevy = { version = "0.20.1", default-features = false, features = [
  "default_app", "std", "bevy_winit", "webgl2", "multi_threaded", "custom_cursor", "default_font",
  "3d_bevy_render", "ui_api", "ui_bevy_render", "bevy_audio", "wav", "png", "tonemapping_luts",
  "bevy_picking", "ui_picking", "mesh_picking", "bevy_ui_widgets",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "BinaryType", "Window", "Location", "Storage", "CloseEvent", "ErrorEvent", "Event", "BeforeUnloadEvent"] }
js-sys = "0.3"

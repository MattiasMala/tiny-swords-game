[package]
name = "ts-server"
version.workspace = true
edition.workspace = true

[dependencies]
ts-sim = { path = "../sim" }
serde.workspace = true
postcard.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "compression-br", "set-header"] }
futures-util = "0.3"
getrandom = "0.3"

[dev-dependencies]
# end-to-end test: real WebSocket clients against the real router + room task
tokio-tungstenite = "0.29"
tokio = { version = "1", features = ["io-util"] }
